name: Build Arson Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Focused integration tests
        run: gradle test --no-daemon --stacktrace
      - name: Fabric client startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=15s 90s xvfb-run -a gradle runClient --no-daemon --stacktrace
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            echo "Fabric client startup smoke test exited before timeout with status $STATUS"
            exit "$STATUS"
          fi
          echo "Fabric client remained alive for the 90-second startup smoke window."
      - name: Complete build and remap
        run: gradle build --no-daemon --stacktrace
      - name: Inspect packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          test -s "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | tee build/jar-contents.txt
          sha256sum "$JAR" | tee build/jar-sha256.txt
          printf '%s\n' "$JAR" > build/artifact-path.txt
          printf 'ARTIFACT=%s\n' "$JAR" >> "$GITHUB_ENV"
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: arson-client-verified
          path: |
            ${{ env.ARTIFACT }}
            build/jar-contents.txt
            build/jar-sha256.txt
            build/artifact-path.txt
            build/test-results/test/**
  independent-verification:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: arson-client-verified
          path: verified
      - name: Independently inspect and hash JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find verified -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR"
          sha256sum "$JAR" | tee verified/independent-sha256.txt
          test -s verified/jar-sha256.txt
          EXPECTED=$(awk '{print $1}' verified/jar-sha256.txt)
          ACTUAL=$(awk '{print $1}' verified/independent-sha256.txt)
          test "$EXPECTED" = "$ACTUAL"
          test -f verified/jar-contents.txt
