name: Migrate Arson sources to Meteor Yarn mappings

on:
  push:
    branches:
      - feature/meteor-direct-port

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[run-yarn-migration]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Migrate main sources from Mojang mappings to Yarn
        run: ./gradlew migrateMappings --mappings "1.21.11+build.3" --overrideInputsIHaveABackup --no-daemon

      - name: Migrate test sources from Mojang mappings to Yarn
        run: ./gradlew migrateMappings --input "src/test/java" --output "src/test/java" --mappings "1.21.11+build.3" --overrideInputsIHaveABackup --no-daemon

      - name: Switch Gradle configuration to Meteor's 1.21.11 toolchain
        shell: bash
        run: |
          cat >> gradle.properties <<'EOF'

          yarn_mappings=1.21.11+build.3
          EOF
          sed -i 's/loader_version=0.18.1/loader_version=0.18.2/' gradle.properties
          sed -i 's/fabric_version=0.141.3+1.21.11/fabric_version=0.140.0+1.21.11/' gradle.properties
          sed -i 's/mappings loom.officialMojangMappings()/mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"/' build.gradle
          rm -f .yarn-migration-pending

      - name: Commit migrated sources and mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/test/java gradle.properties build.gradle .yarn-migration-pending
          git add -u
          if git diff --cached --quiet; then
            echo "No migration changes detected."
            exit 1
          fi
          git commit -m "Migrate Arson sources to Meteor Yarn mappings"
          git push origin "HEAD:${{ github.ref_name }}"
